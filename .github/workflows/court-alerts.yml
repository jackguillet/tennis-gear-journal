# Sends Tennis Hub's "book now" phone alerts the minute GameTime opens a requested court time.
# Vercel's free cron only runs once a day, so GitHub calls the check every 5 minutes instead.
# GitHub can start scheduled runs a few minutes late when it's busy.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   TENNIS_HUB_URL  the app's address, e.g. https://tennis-gear-journal.vercel.app
#   CRON_SECRET     the same value as CRON_SECRET in the Vercel project's environment variables
# Without them the job does nothing.
name: Court alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run the court alert check
        env:
          URL: ${{ secrets.TENNIS_HUB_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "TENNIS_HUB_URL or CRON_SECRET isn't set; skipping."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $SECRET" "${URL%/}/api/reminders?only=courts"
